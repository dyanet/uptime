# nginx stand-in for the monitored sites. Port 80 only: nothing listens on 443,
# so the monitor's HTTPS attempt is refused and it falls back to http://.
# Each monitored name maps to one behaviour by server_name.

# Unknown Host header -> 404, so a misrouted request never looks "up".
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

# Healthy site: 200 with a static page.
server {
    listen 80;
    server_name up.127.0.0.1.nip.io;
    root /usr/share/nginx/html/up;
    sendfile off;
}

# Broken site: every request is a 503.
server {
    listen 80;
    server_name down.127.0.0.1.nip.io;
    location / {
        default_type text/plain;
        return 503 "service unavailable\n";
    }
}

# Site whose home page is rewritten by run.sh between monitor runs.
# sendfile/caching off so the bind-mounted file is re-read on every request.
server {
    listen 80;
    server_name changed.127.0.0.1.nip.io;
    root /usr/share/nginx/html/changed;
    sendfile off;
    open_file_cache off;
    add_header Cache-Control "no-store";
}
